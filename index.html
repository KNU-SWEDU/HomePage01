<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM Studio Web Chat</title>
    <style>
        /* 스타일 (CSS) */
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* 상단 헤더 & 연결 설정 */
        .header { background-color: #ffffff; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: space-between; }
        .title { font-size: 1.2rem; font-weight: bold; color: #333; }
        .connection-box { display: flex; gap: 10px; }
        input[type="text"] { padding: 8px; border: 1px solid #ddd; border-radius: 4px; width: 250px; }
        button#connectBtn { padding: 8px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        button#connectBtn:hover { background-color: #0056b3; }
        button#connectBtn.connected { background-color: #28a745; cursor: default; }
        
        /* 채팅 영역 */
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        /* 메시지 스타일 */
        .message { max-width: 70%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; position: relative; word-wrap: break-word; }
        .message.user { align-self: flex-end; background-color: #007bff; color: white; border-bottom-right-radius: 2px; }
        .message.ai { align-self: flex-start; background-color: #ffffff; color: #333; border: 1px solid #ddd; border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .message .role { font-size: 0.75rem; margin-bottom: 5px; opacity: 0.8; }
        
        /* 입력 영역 */
        .input-area { background-color: white; padding: 20px; border-top: 1px solid #ddd; display: flex; gap: 10px; }
        textarea { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 8px; resize: none; height: 50px; outline: none; }
        button#sendBtn { width: 80px; background-color: #333; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button#sendBtn:disabled { background-color: #ccc; cursor: not-allowed; }

        /* 로딩 표시 */
        .typing-indicator { display: none; font-size: 0.8rem; color: #666; margin-left: 20px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">🤖 LM Studio Web Client</div>
        <div class="connection-box">
            <input type="text" id="hostAddress" value="http://localhost:1234/v1" placeholder="주소 입력 (예: http://192.168.0.5:1234/v1)">
            <button id="connectBtn" onclick="connectServer()">연결하기</button>
        </div>
    </div>

    <div id="chat-container">
        <div class="message ai">
            <div class="role">System</div>
            안녕하세요! 상단의 주소를 확인하고 '연결하기' 버튼을 눌러 대화를 시작하세요.
        </div>
    </div>
    
    <div class="typing-indicator" id="loading">AI가 생각 중입니다...</div>

    <div class="input-area">
        <textarea id="userInput" placeholder="메시지를 입력하세요..." disabled></textarea>
        <button id="sendBtn" onclick="sendMessage()" disabled>전송</button>
    </div>

    <script>
        // 자바스크립트 (로직)
        let messagesHistory = [
            { role: "system", content: "당신은 도움이 되는 AI 어시스턴트입니다." }
        ];
        let isConnected = false;
        let apiUrl = "";

        // 1. 서버 연결 함수
        async function connectServer() {
            const addressInput = document.getElementById('hostAddress');
            const btn = document.getElementById('connectBtn');
            const userUrl = addressInput.value.replace(/\/$/, ""); // 끝에 / 제거

            btn.innerText = "연결 확인 중...";
            
            try {
                // 모델 리스트를 요청해서 연결 테스트
                const response = await fetch(`${userUrl}/models`);
                
                if (response.ok) {
                    isConnected = true;
                    apiUrl = userUrl;
                    
                    // UI 업데이트
                    btn.innerText = "연결됨 ✅";
                    btn.classList.add("connected");
                    addressInput.disabled = true;
                    btn.disabled = true;
                    
                    // 채팅 활성화
                    document.getElementById('userInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    alert("LM Studio와 성공적으로 연결되었습니다!");
                } else {
                    throw new Error("서버 응답 오류");
                }
            } catch (error) {
                console.error(error);
                btn.innerText = "연결 실패 (재시도)";
                alert("연결 실패! \n1. LM Studio가 켜져 있는지 확인하세요.\n2. Server Options에서 'CORS'가 켜져 있는지 꼭 확인하세요.");
            }
        }

        // 2. 메시지 전송 함수
        async function sendMessage() {
            if (!isConnected) return;

            const inputField = document.getElementById('userInput');
            const userText = inputField.value.trim();
            if (!userText) return;

            // 사용자 메시지 화면에 추가
            addMessageToUI("user", userText);
            messagesHistory.push({ role: "user", content: userText });
            inputField.value = ""; // 입력창 비우기

            // 로딩 표시
            const loadingIndicator = document.getElementById('loading');
            loadingIndicator.style.display = "block";

            try {
                // API 요청 (LM Studio / OpenAI 호환)
                const response = await fetch(`${apiUrl}/chat/completions`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "local-model", // LM Studio는 로드된 모델을 자동 사용
                        messages: messagesHistory,
                        temperature: 0.7
                    })
                });

                const data = await response.json();
                const aiText = data.choices[0].message.content;

                // AI 응답 화면에 추가
                addMessageToUI("ai", aiText);
                messagesHistory.push({ role: "assistant", content: aiText });

            } catch (error) {
                addMessageToUI("ai", "오류가 발생했습니다: " + error.message);
            } finally {
                loadingIndicator.style.display = "none";
            }
        }

        // 3. 화면에 말풍선 추가하는 도구
        function addMessageToUI(role, text) {
            const container = document.getElementById('chat-container');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            // 줄바꿈 처리
            const formattedText = text.replace(/\n/g, "<br>");
            msgDiv.innerHTML = `<div class="role">${role === 'user' ? '나' : 'AI'}</div>${formattedText}`;
            
            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight; // 스크롤 맨 아래로
        }

        // 엔터키 입력 시 전송
        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
