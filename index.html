<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 로컬 AI 채팅</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user { background-color: #e1ffc7; text-align: right; }
        .ai { background-color: #f1f0f0; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background-color: #ccc; }
    </style>
</head>
<body>

    <h1>🤖 LM Studio Web Client</h1>
    
    <div id="chat-box"></div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="메시지를 입력하세요..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()" id="send-btn">전송</button>
    </div>

    <script>
        // LM Studio 기본 주소1
        const API_URL = "http://localhost:1234/v1/chat/completions";

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const chatBox = document.getElementById('chat-box');
            const userText = inputField.value;

            if (!userText) return;

            // 1. 사용자 메시지 화면에 표시
            appendMessage("나", userText, "user");
            inputField.value = "";
            inputField.disabled = true;
            sendBtn.disabled = true;

            // 2. LM Studio에 요청 보낼 데이터 준비
            const requestBody = {
                model: "local-model", // LM Studio는 현재 로드된 모델을 사용하므로 이름은 크게 상관없음
                messages: [
                    { role: "system", content: "당신은 도움이 되는 AI 어시스턴트입니다." },
                    { role: "user", content: userText }
                ],
                temperature: 0.7
            };

            try {
                // 3. API 요청 전송
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(requestBody)
                });

                const data = await response.json();
                
                // 4. AI 응답 화면에 표시
                const aiText = data.choices[0].message.content;
                appendMessage("AI", aiText, "ai");

            } catch (error) {
                console.error("Error:", error);
                appendMessage("시스템", "LM Studio 연결 실패! 서버가 켜져 있는지 확인하세요.", "ai");
            } finally {
                inputField.disabled = false;
                sendBtn.disabled = false;
                inputField.focus();
            }
        }

        function appendMessage(sender, text, className) {
            const chatBox = document.getElementById('chat-box');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${text.replace(/\n/g, "<br>")}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight; // 스크롤 아래로
        }
    </script>
</body>
</html>
