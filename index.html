<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM Studio Web Client</title>
    <style>
        :root {
            --bg-color: #1e1e1e;
            --sidebar-bg: #252526;
            --chat-bg: #1e1e1e;
            --input-bg: #3c3c3c;
            --text-color: #ffffff;
            --accent-color: #007acc;
            --user-msg-bg: #005a9e;
            --ai-msg-bg: #333333;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 사이드바 (설정 메뉴) */
        .sidebar {
            width: 300px;
            background-color: var(--sidebar-bg);
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
        }

        .sidebar h2 { margin-top: 0; font-size: 1.2rem; }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #ccc; }
        .input-group input {
            width: 100%;
            padding: 8px;
            background-color: var(--input-bg);
            border: 1px solid #555;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button#connect-btn {
            width: 100%;
            padding: 10px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button#connect-btn:hover { background-color: #0062a3; }

        .status {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #aaa;
            text-align: center;
        }
        .status.connected { color: #4caf50; }
        .status.error { color: #f44336; }

        /* 메인 채팅 영역 */
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 10px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 2px;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            border-bottom-left-radius: 2px;
        }

        .loading { font-style: italic; color: #888; font-size: 0.8rem; }

        /* 입력 영역 */
        .input-area {
            padding: 20px;
            background-color: var(--sidebar-bg);
            display: flex;
            gap: 10px;
            border-top: 1px solid #333;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #555;
            background-color: var(--input-bg);
            color: white;
        }

        #send-btn {
            padding: 0 20px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        #send-btn:disabled { background-color: #555; cursor: not-allowed; }

    </style>
</head>
<body>

    <!-- 왼쪽 사이드바: 접속 설정 -->
    <div class="sidebar">
        <h2>원격 접속 설정</h2>
        <div class="input-group">
            <label for="api-url">서버 주소 (URL)</label>
            <!-- 로컬인 경우 localhost, 원격인 경우 IP 입력 -->
            <input type="text" id="api-url" value="http://155.230.34.187:2345/v1" placeholder="예: http://155.230.34.187:2345/v1">
        </div>
        
        <div class="input-group">
            <label for="system-prompt">시스템 프롬프트 (선택)</label>
            <input type="text" id="system-prompt" value="당신은 도움이 되는 AI 어시스턴트입니다." placeholder="AI의 역할을 지정하세요">
        </div>

        <button id="connect-btn">연결</button>
        <div id="connection-status" class="status">연결 대기 중...</div>
    </div>

    <!-- 오른쪽 메인: 채팅창 -->
    <div class="main-chat">
        <div id="chat-container">
            <div class="message ai">안녕하세요! LM Studio에 연결하신 후 대화를 시작해보세요.</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="메시지를 입력하세요..." onkeypress="if(event.key === 'Enter') sendMessage()">
            <button id="send-btn" onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        let isConnected = false;
        let conversationHistory = [];

        const connectBtn = document.getElementById('connect-btn');
        const statusDisplay = document.getElementById('connection-status');
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        // 1. 연결 버튼 기능
        connectBtn.addEventListener('click', async () => {
            const apiUrl = document.getElementById('api-url').value;
            statusDisplay.textContent = "연결 시도 중...";
            statusDisplay.className = "status";

            try {
                // 모델 리스트를 가져오는 가벼운 요청으로 연결 테스트
                const response = await fetch(`${apiUrl}/models`);
                
                if (response.ok) {
                    isConnected = true;
                    statusDisplay.textContent = "연결 성공!";
                    statusDisplay.className = "status connected";
                    
                    // 시스템 프롬프트 초기화
                    const systemPrompt = document.getElementById('system-prompt').value;
                    conversationHistory = [
                        { role: "system", content: systemPrompt }
                    ];
                } else {
                    throw new Error("서버 응답 오류");
                }
            } catch (error) {
                console.error(error);
                isConnected = false;
                statusDisplay.textContent = "연결 실패: LM Studio의 CORS 설정을 확인하세요.";
                statusDisplay.className = "status error";
            }
        });

        // 2. 메시지 전송 기능
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            if (!isConnected) {
                alert("먼저 '연결' 버튼을 눌러 서버와 연결해주세요.");
                return;
            }

            // 사용자 메시지 화면 표시
            appendMessage("user", text);
            userInput.value = '';
            sendBtn.disabled = true;

            // 대화 기록에 추가
            conversationHistory.push({ role: "user", content: text });

            // 로딩 표시
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai loading';
            loadingDiv.textContent = 'AI가 생각 중입니다...';
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            const apiUrl = document.getElementById('api-url').value;

            try {
                const response = await fetch(`${apiUrl}/chat/completions`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: conversationHistory,
                        temperature: 0.7,
                        max_tokens: -1,
                        stream: false 
                    })
                });

                const data = await response.json();
                
                // 로딩 제거
                chatContainer.removeChild(loadingDiv);

                if (data.choices && data.choices.length > 0) {
                    const aiText = data.choices[0].message.content;
                    appendMessage("ai", aiText);
                    conversationHistory.push({ role: "assistant", content: aiText });
                } else {
                    appendMessage("ai", "오류: 응답을 받을 수 없습니다.");
                }

            } catch (error) {
                chatContainer.removeChild(loadingDiv);
                appendMessage("ai", `통신 오류: ${error.message}`);
            } finally {
                sendBtn.disabled = false;
            }
        }

        // 화면에 메시지 추가하는 헬퍼 함수
        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
